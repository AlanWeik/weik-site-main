name: Publicera till Inleed

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4

      - name: Konfigurera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera och bygg
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Skicka filer via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/staging.weik.se/public_html/
          dangerous-clean-slave: false
          security: loose